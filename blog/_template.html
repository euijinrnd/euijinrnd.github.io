<!DOCTYPE html>
<!--
  New post (this file is not published — Jekyll skips names starting with "_"):
  1. Copy to blog/<slug>/index.html (slug: lowercase-words-with-hyphens)
  2. Replace every ALL-CAPS placeholder below
  3. Add a row to blog/index.html, to the top of the Blog list in /index.html,
     and a <url> to sitemap.xml
  4. No math? Delete the KaTeX block
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POST TITLE | Euijin Jeong</title>
  <meta name="description" content="ONE-SENTENCE SUMMARY">
  <meta name="author" content="Euijin Jeong">

  <link rel="canonical" href="https://jinprelude.github.io/blog/SLUG/">

  <meta property="og:type" content="article">
  <meta property="og:url" content="https://jinprelude.github.io/blog/SLUG/">
  <meta property="og:title" content="POST TITLE">
  <meta property="og:description" content="ONE-SENTENCE SUMMARY">
  <meta property="og:image" content="https://jinprelude.github.io/img/profile.jpg">
  <meta property="article:published_time" content="YYYY-MM-DD">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@euijinrnd">

  <link rel="stylesheet" href="/css/style.css">

  <!-- KaTeX: $...$ inline, $$...$$ display -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]})"></script>
</head>

<body>
  <main class="container">
    <p class="back"><a href="/blog/">← Blog</a></p>

    <article class="post">
      <header class="post-header">
        <h1>POST TITLE</h1>
        <p class="meta"><time datetime="YYYY-MM-DD">MON DD, YYYY</time></p>
      </header>

      <p>First paragraph.</p>

      <h2>Section</h2>
      <p>Body text with <code>inline code</code> and math $\pi(a \mid s)$.</p>

      <figure>
        <img src="figure.png" alt="DESCRIPTION">
        <figcaption>Figure caption.</figcaption>
      </figure>
    </article>
  </main>
  <footer>
    <p><a href="/">Euijin Jeong</a> · <a href="/blog/">Blog</a></p>
  </footer>
</body>

</html>
